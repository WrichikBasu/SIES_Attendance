name: Release

# Runs for every tag pushed to GitHub, whether it was created locally and pushed or
# created on github.com (both arrive as a tag push).
on:
  push:
    tags:
      - '*'

permissions:
  contents: write   # create the release and upload its assets

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history and tags, for the changelog

      # :shared builds on a Java 21 toolchain and :server on 25. Installing both up front
      # saves the foojay resolver downloading them; the last one listed runs Gradle.
      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIES_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIES_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      # The signing variables are set on this step only. Every Gradle run configures :app,
      # so if the keystore path leaked into a later step without its passwords, that step
      # would fail even though it never signs anything.
      - name: Build signed APK and AAB
        env:
          SIES_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          SIES_KEYSTORE_PASSWORD: ${{ secrets.SIES_KEYSTORE_PASSWORD }}
          SIES_KEY_ALIAS: ${{ secrets.SIES_KEY_ALIAS }}
          SIES_KEY_PASSWORD: ${{ secrets.SIES_KEY_PASSWORD }}
          # Optional: the server the release build syncs to. Empty means a standalone app.
          SIES_RELEASE_SYNC_URL: ${{ secrets.SIES_RELEASE_SYNC_URL }}
        run: |
          ./gradlew \
            -Psies.releaseSyncUrl="$SIES_RELEASE_SYNC_URL" \
            :app:assembleRelease :app:bundleRelease

      - name: Build server jar
        run: ./gradlew :server:bootJar

      - name: Collect release assets
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk     "dist/sies-attendance-$TAG.apk"
          cp app/build/outputs/bundle/release/app-release.aab  "dist/sies-attendance-$TAG.aab"
          cp app/build/outputs/mapping/release/mapping.txt     "dist/mapping-$TAG.txt"
          cp server/build/libs/sies-attendance.jar             "dist/sies-attendance-server-$TAG.jar"
          ls -l dist

      - name: Write changelog
        run: |
          # Commits since the previous tag reachable from this one, or the whole history
          # if this is the first tag.
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            RANGE="$PREV..$TAG"
            echo "## Changes since $PREV" > CHANGELOG.md
          else
            RANGE="$TAG"
            echo "## Changes" > CHANGELOG.md
          fi
          echo >> CHANGELOG.md
          git log --no-merges --pretty=format:'- %s (%h)' "$RANGE" >> CHANGELOG.md
          cat CHANGELOG.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if echo "$TAG" | grep -qiE 'alpha|beta'; then
            PRERELEASE="--prerelease"
          fi
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes-file CHANGELOG.md \
            --verify-tag \
            $PRERELEASE

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
