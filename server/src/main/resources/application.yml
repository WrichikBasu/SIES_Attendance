# Configuration for the service.
#
# Every credential comes from the environment. This file is committed, and the
# database password is the one secret that opens every attendance record in the
# college; there is no development default for it on purpose, so a missing
# variable fails at startup rather than quietly connecting to something.

spring:
  application:
    name: sies-attendance

  datasource:
    # 55432 rather than 5432 so a local development database cannot collide with
    # a PostgreSQL already running on the machine. See server/README.md.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55432}/${DB_NAME:sies}
    # NOT the owner. The service connects as a role that cannot run DDL and
    # cannot UPDATE or DELETE an audit row; see "Three database roles" in
    # server/README.md.
    username: ${DB_APP_USER:sies_app}
    password: ${DB_APP_PASSWORD}
    hikari:
      # A dozen phones, not a public website. The between-periods burst is the
      # load that matters, and it is a burst of short writes.
      maximum-pool-size: 10
      minimum-idle: 2
      # Belt and braces with user.timezone below: the schema never relies on an
      # ambient zone, and neither should a session.
      connection-init-sql: SET TIME ZONE 'UTC'

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Migrations run as the owner, which is the only thing the owner is for.
    user: ${DB_OWNER_USER:sies_owner}
    password: ${DB_OWNER_PASSWORD}
    # Refuse a migration file edited after it was applied somewhere. That is the
    # usual way two environments drift apart with nobody noticing.
    validate-on-migrate: true
    # Never adopt an unknown non-empty database by assuming it already matches.
    baseline-on-migrate: false
    # flyway clean drops every object in the schema. On a database holding real
    # attendance that command must be impossible to run by accident.
    clean-disabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # Health only. The skeleton has no authentication yet, so nothing that
        # describes the inside of the service is exposed.
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    # The statements are assembled from a filter at run time, so seeing the one
    # that actually ran is the difference between a five-minute diagnosis and an
    # afternoon. Values are bound, never logged.
    org.springframework.jdbc.core.JdbcTemplate: ${SQL_LOG_LEVEL:INFO}
